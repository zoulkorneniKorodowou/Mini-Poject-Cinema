<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine WONOU Search</title>
    <link rel="stylesheet" href="../src/css/style_file.css">
    
</head>

<body>
    <header>
        <div id="logo">
            <img src="../src/images/logoWonou.jpeg" alt="logo du ciné WONOU">
        </div>
        <div>
            <h1>Ciné<span>WONOU</span></h1>
        </div>
        <div>
            <nav id="navbar">
                <li>
                    <a href="../index.html">Accueil</a>
                </li>
            </nav>

    </header>
    <main>
        <section id="lookfor" class="search_movies">
            <div class="section_header">
                <h1>

                </h1>

        <section id="search_results" class="movies_grid">

    <footer>
        <section class="foot_displays" id="networks">
            <div>
                <h2>
                    Suivez-nous
                </h2>
            </div>
            <a href="">
                <img src="../src/images/logoFacebook.webp" alt="logo de facebook">
            </a><a href="">
                <img src="../src/images/logoInsta.webp" alt="logod'instagram">
            </a><a href="">
                <img src="../src/images/loloTiktok.webp" alt="logo de tiktok">
            </a>
        </section>
        <section class="foot_displays" id="legal_infos">
            <div>
                <a href="" class="infos">Infos Legales</a>
            </div>
            <div>
                <details>
                    <summary>
                        Contacts
                    </summary>
                    <h4>
                        +33 744565426
                    </h4>
                    <h4>
                        wonou.cine@gmail.com
                    </h4>
                </details>
            </div>
        </section>
    </footer>
    <script type="module" src="../src/js/search.js"></script>

</html>
